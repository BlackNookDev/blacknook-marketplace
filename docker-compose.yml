# BlackNOOK Marketplace — yalnızca uygulama.
# PostgreSQL Coolify (veya harici) servisidir; bu compose içinde yok.
#
# Coolify: app ile Postgres aynı Docker network'te olmalı.
# DB_HOST = Coolify Postgres internal hostname (ör. opzltzid4nnqpeky0libvyvh)

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://blacknook.com}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_GOOGLE_OAUTH: ${NEXT_PUBLIC_GOOGLE_OAUTH:-}
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:?DB_HOST is required}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:-postgres}
      DB_SSL: ${DB_SSL:-false}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://blacknook.com}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://blacknook.com}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      NEXT_PUBLIC_GOOGLE_OAUTH: ${NEXT_PUBLIC_GOOGLE_OAUTH:-}
      NEXT_PUBLIC_SPLINE_URL: ${NEXT_PUBLIC_SPLINE_URL:-}
      INSTALLATION_REQUEST_TO: ${INSTALLATION_REQUEST_TO:-dev@blacknook.com}
      MATCH_REQUEST_TO: ${MATCH_REQUEST_TO:-contact@blacknook.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-BlackNOOK <noreply@blacknook.com>}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@blacknook.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-BlacknookAdmin1}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      UPLOAD_DIR: /app/uploads
    ports:
      - '127.0.0.1:${APP_PORT:-18080}:3000'
    volumes:
      - blacknook_marketplace_uploads:/app/uploads
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  blacknook_marketplace_uploads:
