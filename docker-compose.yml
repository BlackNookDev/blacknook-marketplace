# BlackNOOK Marketplace — Docker Compose
#
# Lokal / NPM: app → 127.0.0.1:18080, pgadmin → 127.0.0.1:18081
# Coolify: domain'i servis portlarına bağla (app:3000, pgadmin:80)
#
# PostgreSQL host'a publish EDİLMEZ.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-blacknook}
    volumes:
      - blacknook_marketplace_postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    # Coolify ilk boot'ta schema init sırasında kısa süre ready olmayabilir;
    # start_period düşük olursa depends_on "unhealthy" deyip deploy düşer.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - blacknook_marketplace_internal

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://blacknook.com}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_GOOGLE_OAUTH: ${NEXT_PUBLIC_GOOGLE_OAUTH:-}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:-blacknook}
      DB_SSL: 'false'
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://blacknook.com}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://blacknook.com}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      NEXT_PUBLIC_GOOGLE_OAUTH: ${NEXT_PUBLIC_GOOGLE_OAUTH:-}
      NEXT_PUBLIC_SPLINE_URL: ${NEXT_PUBLIC_SPLINE_URL:-}
      INSTALLATION_REQUEST_TO: ${INSTALLATION_REQUEST_TO:-dev@blacknook.com}
      MATCH_REQUEST_TO: ${MATCH_REQUEST_TO:-contact@blacknook.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-BlackNOOK <noreply@blacknook.com>}
    ports:
      - '127.0.0.1:${APP_PORT:-18080}:3000'
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - blacknook_marketplace_internal

  pgadmin:
    image: dpage/pgadmin4:8
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@blacknook.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD is required}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - blacknook_marketplace_pgadmin_data:/var/lib/pgadmin
    ports:
      - '127.0.0.1:${PGADMIN_PORT:-18081}:80'
    expose:
      - '80'
    networks:
      - blacknook_marketplace_internal

volumes:
  blacknook_marketplace_postgres_data:
  blacknook_marketplace_pgadmin_data:

networks:
  blacknook_marketplace_internal:
    driver: bridge
